name: CI eVDP

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. Lint
  lint:
    name: Lint et formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les outils
        run: pip install ruff==0.16.6 black==26.5.1

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check --diff .

  # ---------------------------------------------------------------- 2. Tests
  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: evdp_test
          POSTGRES_USER: evdp
          POSTGRES_PASSWORD: evdp-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_ENGINE: postgres
      SECRET_KEY: ci-secret-key-not-used-in-production
      POSTGRES_DB: evdp_test
      POSTGRES_USER: evdp
      POSTGRES_PASSWORD: evdp-ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements/dev.txt

      - name: Verifier l'absence de migration manquante
        run: python manage.py makemigrations --check --dry-run

      - name: Verifier la configuration
        run: python manage.py check

      - name: Suite de tests
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing -q

      - name: Publier la couverture
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # ------------------------------------------------------- 3. Scan securite
  security:
    name: Analyse de securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les outils
        run: pip install bandit==1.9.4 pip-audit

      - name: Bandit (analyse statique)
        run: bandit -r apps config -ll -f screen

      - name: pip-audit (vulnerabilites des dependances)
        run: pip-audit -r requirements/base.txt --strict

      - name: Verifier l'absence de secret commite
        run: |
          set -e
          echo "Recherche de fichiers .env commites…"
          if git ls-files | grep -E '^\.env$|^\.env\.(local|prod|production)$'; then
            echo "::error::Un fichier .env est commite dans le depot."
            exit 1
          fi
          echo "Recherche de cles privees…"
          if git grep -lE 'BEGIN (RSA |OPENSSH |PGP )?PRIVATE KEY' -- . ':!docs' ':!apps/core/pgp.py' ':!tests'; then
            echo "::error::Une cle privee semble commitee."
            exit 1
          fi
          echo "Aucun secret detecte."

  # -------------------------------------------------------- 4. Build Docker
  build:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          load: true
          tags: evdp-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verifier que l'image ne tourne pas en root
        run: |
          USER_ID=$(docker run --rm --entrypoint id evdp-app:ci -u)
          echo "UID applicatif : ${USER_ID}"
          if [ "${USER_ID}" = "0" ]; then
            echo "::error::L'image s'execute en root."
            exit 1
          fi

      - name: Exporter l'image
        run: docker save evdp-app:ci -o /tmp/evdp-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/evdp-image.tar
          retention-days: 1

  # --------------------------------------------------- 5. Scan de l'image
  image-scan:
    name: Scan de vulnerabilites de l'image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: Charger l'image
        run: docker load -i /tmp/evdp-image.tar

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evdp-app:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy (echec sur CRITICAL/HIGH corrigeable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evdp-app:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ----------------------------------------- 6. Verification des migrations
  migration-check:
    name: Coherence des migrations
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: Charger l'image
        run: docker load -i /tmp/evdp-image.tar

      - name: Demarrer PostgreSQL
        run: |
          docker network create evdp-ci
          docker run -d --name evdp-db --network evdp-ci \
            -e POSTGRES_DB=evdp -e POSTGRES_USER=evdp -e POSTGRES_PASSWORD=ci \
            postgres:16.4-alpine
          for _ in $(seq 1 30); do
            docker exec evdp-db pg_isready -U evdp && break
            sleep 2
          done

      - name: Appliquer les migrations sur une base vierge
        run: |
          docker run --rm --network evdp-ci \
            -e DJANGO_SETTINGS_MODULE=config.settings.prod \
            -e SECRET_KEY=ci-secret-key \
            -e ALLOWED_HOSTS=localhost \
            -e POSTGRES_HOST=evdp-db -e POSTGRES_PASSWORD=ci \
            -e REDIS_URL=redis://localhost:6379/0 \
            --entrypoint python \
            evdp-app:ci manage.py migrate --no-input

      - name: Verifier l'absence de migration manquante
        run: |
          docker run --rm --network evdp-ci \
            -e DJANGO_SETTINGS_MODULE=config.settings.prod \
            -e SECRET_KEY=ci-secret-key \
            -e ALLOWED_HOSTS=localhost \
            -e POSTGRES_HOST=evdp-db -e POSTGRES_PASSWORD=ci \
            -e REDIS_URL=redis://localhost:6379/0 \
            --entrypoint python \
            evdp-app:ci manage.py makemigrations --check --dry-run
