# =============================================================================
# eVDP - reverse proxy applicatif (SURCOUCHE DEVELOPPEMENT)
#
# Copie de evdp.conf pour l'usage local avec docker-compose.dev.yml. La seule
# difference est le cache des fichiers statiques : en dev, DJANGO_SETTINGS_MODULE
# pointe vers config.settings.dev, qui n'utilise PAS de stockage avec empreinte
# de contenu (whitenoise.storage.CompressedStaticFilesStorage, sans manifest).
# Les noms de fichiers (evdp.css, ...) restent donc fixes d'un changement a
# l'autre : un cache "immutable" de 30 jours comme en production servirait
# indefiniment une ancienne version apres chaque modification de CSS/JS.
#
# En production (config.settings.prod), le stockage avec manifest genere des
# noms de fichiers empreints (ex. evdp.a1b2c3.css) : voir evdp.conf pour le
# cache long-duree "immutable", qui reste correct et souhaitable la-bas.
# =============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    set $evdp_app "evdp-web:8000";

    limit_conn evdp_conn 24;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /health/ {
        access_log off;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /ready/ {
        access_log off;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /metrics/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # --- Fichiers statiques (dev : jamais de cache longue duree, cf. entete) --
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        deny all;
        return 404;
    }

    location /login/ {
        limit_req zone=evdp_auth burst=5 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /register/ {
        limit_req zone=evdp_auth burst=3 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /password-reset/ {
        limit_req zone=evdp_auth burst=3 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /report/ {
        limit_req zone=evdp_report burst=5 nodelay;
        client_max_body_size 30m;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location / {
        limit_req zone=evdp_general burst=40 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
