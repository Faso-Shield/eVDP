# =============================================================================
# eVDP - reverse proxy applicatif
#
# En production, activez le bloc TLS ci-dessous et redirigez le port 80 vers
# le port 443 (voir docs/deployment.md).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    set $evdp_app "evdp-web:8000";

    limit_conn evdp_conn 24;

    # --- Restriction des methodes HTTP (OWASP ASVS V14.5.1) ------------------
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- Identifiant de requete (tracabilite forensique) ----------------------
    add_header X-Request-ID $evdp_request_id always;

    # --- En-tetes de securite (l'application en pose aussi : defense en profondeur)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Download-Options "noopen" always;
    # Decommentez une fois le TLS actif :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Sondes d'observabilite -------------------------------------------
    location = /health/ {
        access_log off;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /ready/ {
        access_log off;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Les metriques ne doivent jamais etre exposees sur Internet.
    # Adaptez l'IP autorisee a celle de votre collecteur Prometheus.
    location = /metrics/ {
        allow 127.0.0.1;
        # allow 10.20.0.15;  # IP du collecteur Prometheus (a adapter)
        deny all;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # --- Fichiers statiques ------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # --- Fond de carte (proxy de tuiles, voir tiles.inc) --------------------
    include /etc/nginx/conf.d/tiles.inc;

    # Les pieces jointes ne sont JAMAIS servies directement par Nginx :
    # chaque telechargement passe par la vue applicative qui verifie les
    # droits et journalise l'acces.
    location /media/ {
        deny all;
        return 404;
    }

    # --- Points sensibles : limitation renforcee ---------------------------
    location /login/ {
        limit_req zone=evdp_auth burst=5 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /register/ {
        limit_req zone=evdp_auth burst=3 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /password-reset/ {
        limit_req zone=evdp_auth burst=3 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Depots de fichiers : une video de demonstration peut atteindre 200 Mo
    # (EVDP_MAX_VIDEO_ATTACHMENT_SIZE). Le plafond global de 30 Mo la
    # refuserait avant Django ; il reste en vigueur partout ailleurs.
    location /report/ {
        limit_req zone=evdp_report burst=5 nodelay;
        client_max_body_size 210m;
        client_body_timeout 120s;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location ~ ^/(cases/[^/]+/attachments|api/v1/reports)/ {
        limit_req zone=evdp_general burst=40 nodelay;
        client_max_body_size 210m;
        client_body_timeout 120s;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # --- Application -------------------------------------------------------
    location / {
        limit_req zone=evdp_general burst=40 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# -----------------------------------------------------------------------------
# TLS : renommez tls.conf.template en tls.conf une fois les certificats
# deposes dans docker/nginx/certs/ (evdp.crt, evdp.key), puis renommez
# CE FICHIER en evdp.conf.http-only pour eviter deux blocs port 80
# avec le meme server_name (conflicting server name).
# Voir docs/deployment.md.
# -----------------------------------------------------------------------------
