# =============================================================================
# eVDP - reverse proxy applicatif
#
# En production, activez le bloc TLS ci-dessous et redirigez le port 80 vers
# le port 443 (voir docs/deployment.md).
# =============================================================================

# Le resolveur DNS interne de Docker est interroge a chaque requete :
# sans cela, nginx met en cache l'IP de evdp-web a son demarrage et
# renvoie 502 des que le conteneur applicatif est recree.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    set $evdp_app "evdp-web:8000";

    limit_conn evdp_conn 24;

    # --- En-tetes de securite (l'application en pose aussi : defense en profondeur)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Decommentez une fois le TLS actif :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Sondes d'observabilite -------------------------------------------
    location = /health/ {
        access_log off;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /ready/ {
        access_log off;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Les metriques ne doivent jamais etre exposees sur Internet.
    location = /metrics/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # --- Fichiers statiques ------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Les pieces jointes ne sont JAMAIS servies directement par Nginx :
    # chaque telechargement passe par la vue applicative qui verifie les
    # droits et journalise l'acces.
    location /media/ {
        deny all;
        return 404;
    }

    # --- Points sensibles : limitation renforcee ---------------------------
    location /login/ {
        limit_req zone=evdp_auth burst=5 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /register/ {
        limit_req zone=evdp_auth burst=3 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /password-reset/ {
        limit_req zone=evdp_auth burst=3 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /report/ {
        limit_req zone=evdp_report burst=5 nodelay;
        client_max_body_size 30m;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # --- Application -------------------------------------------------------
    location / {
        limit_req zone=evdp_general burst=40 nodelay;
        proxy_pass http://$evdp_app$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# -----------------------------------------------------------------------------
