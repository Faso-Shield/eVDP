user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Journal incluant l'IP reelle transmise par un eventuel proxy amont.
    log_format evdp '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log evdp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # La banniere de version n'apporte rien a l'utilisateur, seulement a l'attaquant.
    server_tokens off;

    client_max_body_size 30m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    # Limitation de debit en bordure, complementaire de celle de l'application.
    limit_req_zone $binary_remote_addr zone=evdp_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=evdp_auth:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=evdp_report:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=evdp_conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
