user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Journal incluant l'IP reelle transmise par un eventuel proxy amont.
    log_format evdp '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log evdp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # La banniere de version n'apporte rien a l'utilisateur, seulement a l'attaquant.
    server_tokens off;

    # Masquer les en-tetes du backend (defense en profondeur).
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-Runtime;

    # Identifiant unique de requete pour la tracabilite forensique (NIST AU-3).
    map $request_id $evdp_request_id {
        default $request_id;
    }

    # Resolveur DNS interne de Docker, commun a toutes les configurations
    # (evdp.conf et tls.conf). Sans cela, proxy_pass avec variable echoue
    # en 502 des que evdp.conf est renomme au profit de tls.conf (R1).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 30m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    # Limitation de debit en bordure, complementaire de celle de l'application.
    limit_req_zone $binary_remote_addr zone=evdp_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=evdp_auth:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=evdp_report:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=evdp_conn:10m;
    limit_req_status 429;

    # Cache des tuiles cartographiques (conf.d/tiles.inc). /var/cache/nginx
    # est un tmpfs de 128 Mo (docker-compose.yml) : le cache reste en dessous.
    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=evdp_tiles:10m
                     max_size=96m inactive=30d use_temp_path=off;
    limit_conn_status 429;

    # Couche demandee (/tiles/<couche>/z/y/x) -> service Esri. Sans couche :
    # l'imagerie satellite, seule URL qui existait avant le selecteur de fond.
    map $tile_layer $evdp_tile_service {
        default "World_Imagery";
        plan    "World_Street_Map";
        noms    "Reference/World_Boundaries_and_Places";
    }

    # En production derriere un repartiteur de charge, decommentez et adaptez :
    # set_real_ip_from 10.20.0.10;
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
