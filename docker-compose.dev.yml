# =============================================================================
# Surcouche de developpement.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Elle expose les interfaces d'administration UNIQUEMENT sur la boucle locale
# (127.0.0.1) : elles ne doivent jamais etre joignables depuis le reseau.
#
# Ces services ne sont relies qu'a evdp-backend, reseau interne : Docker n'y
# publie aucun port, et les `ports:` ci-dessous restaient sans effet. Chaque
# service publie est donc aussi relie a evdp-dev-ports, reseau ordinaire qui
# ne sert qu'a cette publication (evdp-backend reste interne).
# =============================================================================

x-dev-env: &dev-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DEBUG: "True"
  ALLOWED_HOSTS: "*"
  SECURE_SSL_REDIRECT: "False"
  SECURE_HSTS_SECONDS: "0"
  LOG_FORMAT: simple
  LOG_LEVEL: DEBUG

services:
  evdp-web:
    environment: *dev-env
    volumes:
      # Rechargement du code sans reconstruction de l'image.
      - .:/app
      - evdp-static:/app/staticfiles
      - evdp-media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - evdp-backend
      - evdp-dev-ports

  evdp-worker:
    environment: *dev-env
    volumes:
      - .:/app
      - evdp-media:/app/media

  evdp-beat:
    environment: *dev-env
    volumes:
      - .:/app

  # Mailpit (:8025) est deja publie sur 127.0.0.1 par docker-compose.yml :
  # le redeclarer ici publierait deux fois le meme port.

  # Cache "no-cache" sur /static/ au lieu de l'immutable 30j de prod : en dev,
  # config.settings.dev n'empreinte pas les noms de fichiers (pas de manifest),
  # donc un cache longue duree servirait une ancienne version apres chaque
  # modification de CSS/JS. Ce mount ne remplace que ce fichier precis, pas
  # tout le dossier conf.d (proxy_headers.inc reste celui de la prod).
  evdp-nginx:
    volumes:
      - ./docker/nginx/dev/evdp.conf:/etc/nginx/conf.d/evdp.conf:ro

  # Base exposee en local pour l'inspection avec psql / DBeaver.
  evdp-db:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - evdp-backend
      - evdp-dev-ports

  evdp-redis:
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - evdp-backend
      - evdp-dev-ports

networks:
  evdp-dev-ports:
    driver: bridge
