<div class="form-field">
  <div class="field-label-row">
    {{ field.label_tag }}{% if field.field.required %}<abbr class="required-marker" title="Obligatoire" aria-label="obligatoire">*</abbr>{% endif %}
  </div>
  {{ field }}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
