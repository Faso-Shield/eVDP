{% load evdp_tags %}
<tr>
  <td class="mono nowrap"><a href="{{ case.get_absolute_url }}">{{ case.case_id }}</a></td>
  <td>{{ case.title }}</td>
  <td>{% if case.reporter_id == user.pk %}<span class="muted">—</span>{% else %}<span class="badge {{ case.severity|severity_class }}">{{ case.get_severity_display }}</span>{% endif %}</td>
  <td><span class="status">{% case_status case %}</span></td>
  <td>{% firstof case.organization.acronym case.organization.name "—" %}</td>
  <td class="nowrap small">{{ case.created_at|date:"d/m/Y" }}</td>
</tr>
