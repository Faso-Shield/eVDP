{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?page=1{% if extra_query %}&{{ extra_query }}{% endif %}">Début</a>
    <a href="?page={{ page_obj.previous_page_number }}{% if extra_query %}&{{ extra_query }}{% endif %}">Précédent</a>
  {% endif %}
  <span class="current">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if extra_query %}&{{ extra_query }}{% endif %}">Suivant</a>
    <a href="?page={{ page_obj.paginator.num_pages }}{% if extra_query %}&{{ extra_query }}{% endif %}">Fin</a>
  {% endif %}
</nav>
{% endif %}
