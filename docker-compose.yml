# =============================================================================
# eVDP - Plateforme nationale de divulgation coordonnee de vulnerabilites
# Projet FASO SHIELD
#
# Seul Nginx est expose. PostgreSQL et Redis restent sur le reseau interne
# et ne sont joignables que par les services applicatifs. Les pieces jointes
# sont stockees sur disque, dans le volume evdp-media.
#
#   docker compose up -d
#   docker compose run --rm evdp-web seed
# =============================================================================

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY est obligatoire, voir .env.example}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY est obligatoire, voir .env.example}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,evdp-web,evdp-nginx}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  POSTGRES_DB: ${POSTGRES_DB:-evdp}
  POSTGRES_USER: ${POSTGRES_USER:-evdp}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
  POSTGRES_HOST: evdp-db
  POSTGRES_PORT: "5432"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-evdp-redis-secret}
  REDIS_URL: redis://:${REDIS_PASSWORD:-evdp-redis-secret}@evdp-redis:6379/0
  REDIS_HOST: evdp-redis
  REDIS_PORT: "6379"
  # Pieces jointes sur disque (volume evdp-media). Les images MinIO ne sont
  # plus distribuees publiquement ; USE_S3=True reste possible vers un
  # stockage S3 externe (variables MINIO_* dans .env).
  USE_S3: ${USE_S3:-False}
  # Mailpit par defaut ; un relais reel (avec authentification) se
  # configure dans .env, sans toucher a ce fichier.
  EMAIL_HOST: ${EMAIL_HOST:-evdp-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-30}
  EMAIL_USER: ${EMAIL_USER:-}
  EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-eVDP <no-reply@evdp.bf>}
  SITE_BASE_URL: ${SITE_BASE_URL:-}
  EVDP_NATIONAL_TEAM: ${EVDP_NATIONAL_TEAM:-ANSSI-BF / CSIRT National}
  EVDP_CONTACT_EMAIL: ${EVDP_CONTACT_EMAIL:-vdp@anssi.bf}
  EVDP_DEFAULT_CURRENCY: ${EVDP_DEFAULT_CURRENCY:-XOF}
  PGP_PUBLIC_KEY: ${PGP_PUBLIC_KEY:-}
  PGP_FINGERPRINT: ${PGP_FINGERPRINT:-}
  # Antivirus actif par defaut (service evdp-clamav). Vide : desactive.
  CLAMAV_HOST: ${CLAMAV_HOST-evdp-clamav}
  CLAMAV_STREAM_MAX_LENGTH: ${CLAMAV_STREAM_MAX_LENGTH:-26214400}
  MESSAGE_INTEGRITY_KEY: ${MESSAGE_INTEGRITY_KEY:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  TIME_ZONE: ${TIME_ZONE:-Africa/Ouagadougou}

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/web/Dockerfile
  image: evdp-app:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: *app-env
  networks:
    - evdp-backend
  depends_on:
    evdp-db:
      condition: service_healthy
    evdp-redis:
      condition: service_healthy
  # CIS Docker Benchmark 5.3, 5.12, 5.25, 5.28
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m

services:
  # ---------------------------------------------------------------- donnees
  evdp-db:
    image: postgres:16.4-alpine
    container_name: evdp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evdp}
      POSTGRES_USER: ${POSTGRES_USER:-evdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - evdp-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    networks:
      - evdp-backend
    # Aucun port publie : la base n'est jamais joignable depuis l'exterieur.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evdp} -d ${POSTGRES_DB:-evdp}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 100

  evdp-redis:
    image: redis:7.4-alpine
    container_name: evdp-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --requirepass ${REDIS_PASSWORD:-evdp-redis-secret}
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
      --rename-command CONFIG ""
    volumes:
      - evdp-redis-data:/data
    networks:
      - evdp-backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-evdp-redis-secret} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 384m
          pids: 50

  evdp-mailpit:
    image: axllent/mailpit:v1.21
    container_name: evdp-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    # Interface de consultation des emails : http://127.0.0.1:8025, depuis la
    # machine qui heberge Docker uniquement (jamais depuis le reseau). Sans
    # ce port, les emails de l'installation par defaut etaient invisibles.
    # En production, ce service est retire au profit d'un vrai serveur SMTP
    # (docs/deployment.md, Messagerie).
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    # evdp-backend est interne : Docker n'y publie aucun port. Le reseau
    # evdp-mailpit-ui ne sert qu'a rendre l'interface joignable sur 127.0.0.1.
    networks:
      - evdp-backend
      - evdp-mailpit-ui
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 192m
          pids: 50

  evdp-clamav:
    image: clamav/clamav:1.4.6
    container_name: evdp-clamav
    restart: unless-stopped
    volumes:
      - evdp-clamav-data:/var/lib/clamav
    networks:
      - evdp-backend
      - evdp-external
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 2g
          pids: 50

  # ------------------------------------------------------------ application
  evdp-web:
    <<: *app-base
    container_name: evdp-web
    command: ["web"]
    # Les emails partent d'ici (verification d'adresse, reinitialisation,
    # notifications) : evdp-backend etant interne, evdp-smtp est la seule
    # sortie vers le serveur SMTP de la structure. Sortie seulement : rien
    # n'entre par ce reseau, la plateforme reste servie par Nginx. A limiter au
    # serveur SMTP par le pare-feu de l'hote (docs/deployment.md, Messagerie).
    networks:
      - evdp-backend
      - evdp-smtp
    volumes:
      - evdp-static:/app/staticfiles
      - evdp-media:/app/media
    # Le premier demarrage applique toutes les migrations puis collecte les
    # statiques avant de lancer Gunicorn : plus de 2 minutes sur une machine
    # modeste, au-dela des 40 s de grace du HEALTHCHECK de l'image. Un echec
    # pendant start_period ne compte pas ; le premier succes rend le
    # conteneur sain sans attendre la fin de la periode.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    depends_on:
      evdp-db:
        condition: service_healthy
      evdp-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 200

  evdp-worker:
    <<: *app-base
    container_name: evdp-worker
    command: ["worker"]
    # Les emails partent d'ici (verification d'adresse, reinitialisation,
    # notifications) : evdp-backend etant interne, evdp-smtp est la seule
    # sortie vers le serveur SMTP de la structure. Sortie seulement : rien
    # n'entre par ce reseau, la plateforme reste servie par Nginx. A limiter au
    # serveur SMTP par le pare-feu de l'hote (docs/deployment.md, Messagerie).
    networks:
      - evdp-backend
      - evdp-smtp
    volumes:
      - evdp-media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 768m
          pids: 100

  evdp-beat:
    <<: *app-base
    container_name: evdp-beat
    command: ["beat"]
    healthcheck:
      # Le pidfile existe ET le processus qu'il designe est vivant.
      # (l'image slim ne fournit ni pgrep ni ps)
      test: ["CMD-SHELL", "kill -0 $$(cat /tmp/celerybeat.pid) 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 384m
          pids: 50

  # --------------------------------------------------------------- frontal
  evdp-nginx:
    image: nginx:1.27-alpine
    container_name: evdp-nginx
    restart: unless-stopped
    # L'adresse d'ecoute est explicite : la forme courte "8090:80" fait
    # publier le port sur 0.0.0.0 *et* sur [::], or Docker Desktop annonce
    # ce binding IPv6 sans router le trafic. Les clients qui resolvent
    # "localhost" en ::1 en premier (curl, navigateurs) tombaient alors en
    # timeout au lieu de basculer sur IPv4. En n'exposant que 0.0.0.0, ::1
    # refuse immediatement la connexion et le repli IPv4 fonctionne.
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      # Decommentez pour le TLS :
      # - "0.0.0.0:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - evdp-static:/app/staticfiles:ro
      # Decommentez pour le TLS (certbot --webroot) :
      # - certbot-www:/var/www/certbot:ro
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - evdp-backend
      - evdp-frontend
    depends_on:
      evdp-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/cache/nginx:size=128m
      - /var/run:size=16m
    deploy:
      resources:
        limits:
          memory: 192m
          pids: 100

networks:
  evdp-backend:
    driver: bridge
    internal: true
  evdp-frontend:
    driver: bridge
  evdp-external:
    driver: bridge
  # Sortie des emails (evdp-web, evdp-worker), distincte d'evdp-external
  # (antivirus) : le pare-feu peut la restreindre au seul serveur SMTP sans
  # couper les mises a jour de signatures.
  evdp-smtp:
    driver: bridge
  # Publication de l'interface Mailpit (voir le service evdp-mailpit).
  evdp-mailpit-ui:
    driver: bridge

volumes:
  evdp-db-data:
  evdp-redis-data:
  evdp-static:
  evdp-media:
  evdp-clamav-data:
  # Decommentez pour le TLS (certbot --webroot) :
  # certbot-www:
